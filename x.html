<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The UPS Store Spotswood NJ</title>

  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-180x180.png">

  <style>
    :root{
      --lightblue:#7ec8ff;
      --green:#28a745;
      --red:#dc3545;
      --blue:#0d6efd;
      --card:#0d0d0d;
      --text:#f2f2f2;
      --muted:#b5b5b5;
      --border: rgba(255,255,255,.12);
    }

    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background:#000;
      color:var(--text);
    }

    .wrap{
      max-width:960px;
      margin:0 auto;
      padding:28px 16px 60px;
    }

    .logo{
      display:flex;
      justify-content:center;
    }
    .logo img{
      width:420px;
      max-width:90%;
    }

    h1{
      text-align:center;
      color:var(--lightblue);
      font-size:40px;
      margin:14px 0 24px;
      font-weight:800;
    }

    .section{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      padding:24px;
      box-shadow:0 12px 28px rgba(0,0,0,.4);
      margin-bottom:20px;
    }

    .sectionTitle{
      text-align:center;
      font-weight:900;
      font-size:22px;
      margin-bottom:6px;
    }

    .sectionTip{
      text-align:center;
      font-size:14px;
      color:var(--muted);
      margin-bottom:20px;
    }

    .copyRow{
      display:flex;
      gap:20px;
      justify-content:center;
      flex-wrap:wrap;
    }

    .copyBtn{
      flex:1;
      min-width:260px;
      border:none;
      border-radius:18px;
      padding:28px 24px;
      font-size:24px;
      font-weight:900;
      cursor:pointer;
      color:#fff;
      box-shadow:0 16px 36px rgba(0,0,0,.45);
    }

    .green{ background:var(--green); }
    .red{ background:var(--red); }

    .wifiBtn{
      background:var(--lightblue);
      color:#000;
    }

    .fullRow{
      margin-top:20px;
      display:flex;
      justify-content:center;
    }

    .fullBtn{
      width:100%;
      border:none;
      border-radius:18px;
      padding:28px 24px;
      font-size:24px;
      font-weight:900;
      cursor:pointer;
      color:#fff;
      box-shadow:0 16px 36px rgba(0,0,0,.45);
      background: var(--blue);
    }

    .hint{
      text-align:center;
      margin-top:18px;
      min-height:22px;
      font-weight:700;
      color:var(--muted);
    }

    .formRow{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      justify-content:center;
      margin-bottom:14px;
    }

    .field{
      flex:1;
      min-width:220px;
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    label{
      font-size:12px;
      color:var(--muted);
      font-weight:800;
    }

    input, select{
      border:1px solid var(--border);
      background:#070707;
      color:var(--text);
      border-radius:12px;
      padding:10px 12px;
      font-size:14px;
    }

    .miniBtn{
      border:none;
      border-radius:12px;
      padding:14px 18px;
      font-weight:900;
      cursor:pointer;
      color:#000;
      background:var(--lightblue);
      box-shadow:0 10px 22px rgba(0,0,0,.35);
    }

    .qrLogoWrap{
      position:relative;
      display:inline-block;
    }

    .wifiImg{
      width:180px;
      height:180px;
      background:#fff;
      padding:6px;
      border-radius:10px;
      display:block;
      margin:0 auto;
    }

    .qrLogo{
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%, -50%);
      width:42px;
      background:#fff;
      padding:6px;
      border-radius:8px;
      pointer-events:none;
    }
  </style>
</head>

<body>
<div class="wrap">

  <div class="logo">
    <img src="ups_logo.png" alt="UPS Store Logo">
  </div>
  <h1>The UPS Store Spotswood NJ</h1>

  <!-- MAIN BUTTONS -->
  <div class="section">
    <div class="sectionTitle">Copy Emails</div>

    <div class="copyRow">
      <button class="copyBtn green" id="copyStore">Copy Store Email</button>
      <button class="copyBtn wifiBtn" id="copyWifiTop">Guest Wi-Fi</button>
      <button class="copyBtn red" id="copyGmail">Copy Gmail</button>
    </div>

    <div class="fullRow">
      <button class="fullBtn" id="goBoxCalc">Box Calculator</button>
    </div>

    <div class="hint" id="hint"></div>
  </div>

  <!-- GUEST WI-FI SECTION -->
  <div class="section">
    <div class="sectionTitle">Guest Wi-Fi</div>
    <div class="sectionTip">Tap to copy, or scan to connect.</div>

    <!-- SECOND GUEST WI-FI BUTTON (INSIDE THE BOX) -->
    <div class="fullRow">
      <button class="miniBtn" id="copyWifiInside">Copy Guest Wi-Fi</button>
    </div>

    <div class="formRow">
      <div class="field">
        <label>Wi-Fi name</label>
        <input id="wifiName" value="UPS-Guest">
      </div>

      <div class="field">
        <label>Wi-Fi details</label>
        <input id="wifiDetails" value="CHANGE_ME_MONTHLY">
      </div>

      <div class="field">
        <label>Wi-Fi type</label>
        <select id="wifiType">
          <option value="WPA" selected>WPA/WPA2</option>
          <option value="WEP">WEP</option>
          <option value="">Open</option>
        </select>
      </div>
    </div>

    <div class="fullRow">
      <button class="miniBtn" id="saveWifiImage">Save image</button>
    </div>

    <div class="qrLogoWrap">
      <img id="wifiImg" class="wifiImg" alt="Wi-Fi">
      <img src="ups_logo.png" class="qrLogo" alt="UPS Logo">
    </div>

    <div class="hint" id="wifiHint"></div>
  </div>

</div>

<script>
  const hint = document.getElementById("hint");

  function copyText(text){
    navigator.clipboard.writeText(text).then(()=>{
      hint.textContent = "Copied";
      setTimeout(()=>hint.textContent="",2000);
    });
  }

  document.getElementById("copyStore").onclick = () =>
    copyText("store4925@theupsstore.com");

  document.getElementById("copyGmail").onclick = () =>
    copyText("store4925@gmail.com");

  document.getElementById("goBoxCalc").onclick = () =>
    window.location.href = "https://ups4925.github.io/box.html";

  const wifiName = document.getElementById("wifiName");
  const wifiDetails = document.getElementById("wifiDetails");
  const wifiType = document.getElementById("wifiType");
  const wifiImg = document.getElementById("wifiImg");

  function updateWifi(){
    const n = encodeURIComponent(wifiName.value);
    const d = encodeURIComponent(wifiDetails.value);
    const t = wifiType.value;
    const payload = t ? `WIFI:T:${t};S:${n};P:${d};;` : `WIFI:T:;S:${n};;`;
    wifiImg.src =
      "https://chart.googleapis.com/chart?cht=qr&chs=320x320&chl=" + payload;
  }

  document.getElementById("copyWifiTop").onclick =
  document.getElementById("copyWifiInside").onclick = () =>
    copyText(wifiDetails.value);

  wifiName.oninput = updateWifi;
  wifiDetails.oninput = updateWifi;
  wifiType.onchange = updateWifi;

  updateWifi();
</script>
</body>
</html>
