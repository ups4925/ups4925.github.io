<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The UPS Store Spotswood NJ</title>

  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-180x180.png">

  <style>
    :root{
      --lightblue:#7ec8ff;
      --green:#28a745;
      --red:#dc3545;
      --blue:#0d6efd;
      --card:#0d0d0d;
      --text:#f2f2f2;
      --muted:#b5b5b5;
      --border: rgba(255,255,255,.12);
    }

    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background:#000;
      color:var(--text);
    }

    .wrap{
      max-width:960px;
      margin:0 auto;
      padding:28px 16px 60px;
    }

    .logo{
      display:flex;
      justify-content:center;
    }
    .logo img{
      width:420px;
      max-width:90%;
    }

    h1{
      text-align:center;
      color:var(--lightblue);
      font-size:40px;
      margin:14px 0 24px;
      font-weight:800;
    }

    .section{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      padding:24px;
      box-shadow:0 12px 28px rgba(0,0,0,.4);
      margin-bottom:20px;
    }

    .sectionTitle{
      text-align:center;
      font-weight:900;
      font-size:22px;
      margin-bottom:6px;
    }

    .sectionTip{
      text-align:center;
      font-size:14px;
      color:var(--muted);
      margin-bottom:20px;
    }

    .copyRow{
      display:flex;
      gap:20px;
      justify-content:center;
      flex-wrap:wrap;
    }

    .copyBtn{
      flex:1;
      min-width:260px;
      border:none;
      border-radius:18px;
      padding:28px 24px;
      font-size:24px;
      font-weight:900;
      cursor:pointer;
      color:#fff;
      box-shadow:0 16px 36px rgba(0,0,0,.45);
    }

    .green{ background:var(--green); }
    .red{ background:var(--red); }

    .wifiBtn{
      background:var(--lightblue);
      color:#000;
    }

    .fullRow{
      margin-top:20px;
      display:flex;
      justify-content:center;
    }

    .fullBtn{
      width:100%;
      border:none;
      border-radius:18px;
      padding:28px 24px;
      font-size:24px;
      font-weight:900;
      cursor:pointer;
      color:#fff;
      background:var(--blue);
      box-shadow:0 16px 36px rgba(0,0,0,.45);
    }

    .hint{
      text-align:center;
      margin-top:18px;
      min-height:22px;
      font-weight:700;
      color:var(--muted);
    }

    .infoRow{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      justify-content:center;
      align-items:flex-end;
    }

    .field{
      flex:1;
      min-width:260px;
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    label{
      font-size:12px;
      color:var(--muted);
      font-weight:800;
    }

    input{
      border:1px solid var(--border);
      background:#070707;
      color:var(--text);
      border-radius:12px;
      padding:14px;
      font-size:16px;
    }

    .qrRow{
      display:flex;
      gap:16px;
      justify-content:center;
      flex-wrap:wrap;
    }

    .qrCard{
      border:1px solid var(--border);
      border-radius:14px;
      padding:12px;
      background:rgba(255,255,255,.03);
      text-align:center;
      max-width:200px;
      text-decoration:none;
      color:inherit;
    }

    .qrCard img{
      width:150px;
      background:#fff;
      padding:6px;
      border-radius:10px;
    }

    .qrLabel{
      margin-top:8px;
      font-weight:800;
      font-size:14px;
    }

    .qrSub{
      font-size:12px;
      color:var(--muted);
    }
  </style>
</head>

<body>
<div class="wrap">

  <div class="logo">
    <img src="ups_logo.png" alt="UPS Store Logo">
  </div>
  <h1>The UPS Store Spotswood NJ</h1>

  <!-- COPY EMAILS -->
  <div class="section">
    <div class="sectionTitle">Copy Emails</div>
    <div class="sectionTip">If copy is blocked, we’ll open your mail app instead.</div>

    <div class="copyRow">
      <button class="copyBtn green" id="copyStore">Copy Store Email</button>
      <button class="copyBtn red" id="copyGmail">Copy Gmail</button>
    </div>

    <!-- BOX CALCULATOR BUTTON (RESTORED) -->
    <div class="fullRow">
      <button class="fullBtn" id="goBoxCalc">Box Calculator</button>
    </div>

    <div class="hint" id="hint"></div>
  </div>

  <!-- GUEST WI-FI INFO -->
  <div class="section">
    <div class="sectionTitle">Guest Wi-Fi</div>
    <div class="sectionTip">Tap the button to copy the Wi-Fi details.</div>

    <div class="infoRow">
      <div class="field">
        <label>Network name</label>
        <input value="UPS-Guest" readonly>
      </div>

      <div class="field">
        <label>Wi-Fi details</label>
        <input id="wifiDetails" value="CHANGE_MONTHLY" readonly>
      </div>

      <button class="copyBtn wifiBtn" id="copyWifi" style="min-width:260px;">
        Copy Guest Wi-Fi
      </button>
    </div>

    <div class="hint" id="wifiHint"></div>
  </div>

  <!-- EMAIL QR -->
  <div class="section">
    <div class="sectionTitle">Tap or Scan to Email</div>
    <div class="sectionTip">Tapping a QR opens the email app, same as scanning.</div>

    <div class="qrRow">
      <a class="qrCard" href="mailto:store4925@theupsstore.com">
        <img src="qr_store_email.png" alt="">
        <div class="qrLabel">Store Email</div>
        <div class="qrSub">store4925@theupsstore.com</div>
      </a>

      <a class="qrCard" href="mailto:store4925@gmail.com">
        <img src="qr_gmail.png" alt="">
        <div class="qrLabel">Gmail</div>
        <div class="qrSub">store4925@gmail.com</div>
      </a>
    </div>
  </div>

</div>

<script>
  const hint = document.getElementById("hint");
  const wifiHint = document.getElementById("wifiHint");

  async function copyText(text, target){
    try{
      await navigator.clipboard.writeText(text);
      target.textContent = "Copied";
    }catch{
      target.textContent = "Unable to copy";
    }
    setTimeout(()=>target.textContent="",2000);
  }

  document.getElementById("copyStore").onclick = () =>
    copyText("store4925@theupsstore.com", hint);

  document.getElementById("copyGmail").onclick = () =>
    copyText("store4925@gmail.com", hint);

  document.getElementById("copyWifi").onclick = () =>
    copyText(document.getElementById("wifiDetails").value, wifiHint);

  document.getElementById("goBoxCalc").onclick = () =>
    window.location.href = "https://ups4925.github.io/box.html";
</script>
</body>
</html>
